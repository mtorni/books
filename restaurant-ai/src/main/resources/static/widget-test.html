<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Restaurant AI Widget Test</title>

<style>
body {
    font-family: Arial, sans-serif;
    margin: 20px;
    line-height: 1.4;
}

.page-wrap {
    max-width: 700px;
    margin: 0 auto;
}

.samples {
    margin-top: 20px;
    padding: 16px;
    border: 1px solid #ddd;
    border-radius: 12px;
    background: #fafafa;
}

.sample-row {
    display: flex;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
}

.sample-select {
    flex: 1;
    min-width: 240px;
    padding: 10px;
    border-radius: 8px;
    border: 1px solid #ccc;
    font-size: 16px;
}

.sample-btn {
    padding: 10px 14px;
    border-radius: 8px;
    border: none;
    background: #7a1f1f;
    color: white;
    cursor: pointer;
    font-weight: 600;
}

.help-text {
    margin-top: 10px;
    color: #555;
    font-size: 14px;
}

@media (max-width: 600px) {
    body {
        margin: 14px;
    }

    h1 {
        font-size: 24px;
        margin-bottom: 10px;
    }

    .samples {
        padding: 12px;
    }

    .sample-row {
        flex-direction: column;
        align-items: stretch;
    }

    .sample-select,
    .sample-btn {
        width: 100%;
    }
}
</style>
</head>

<body>
<div class="page-wrap">
    <h1>Restaurant Widget Test Page</h1>
    <p>This page simulates a restaurant website.</p>

    <div class="samples">
        <h3>Try a sample question</h3>

        <div class="sample-row">
            <select id="sampleQuestion" class="sample-select">
                <option value="">Select a sample question...</option>
                <option>What steaks do you have?</option>
                <option>Do you have anything under $40?</option>
                <option>What are your hours?</option>
                <option>Do you have seafood options?</option>
                <option>What appetizers do you recommend?</option>
                <option>What cocktails do you have?</option>
                <option>Do you have beer on tap?</option>
                <option>What non-alcoholic drinks do you offer?</option>
                <option>Do you have drinks for kids?</option>
                <option>Do you have a Shirley Temple?</option>
                <option>What do you have for happy hour?</option>
                <option>What drinks are on happy hour?</option>
                <option>Do you have wings on happy hour?</option>
                <option>How much are wings during happy hour?</option>
                <option>What can I get under $10 during happy hour?</option>
                <option>I'm coming in for happy hour with my kids. What can we get?</option>
            </select>

            <button class="sample-btn" onclick="fillChatFromDropdown()">Use Question</button>
        </div>

        <div class="help-text">
            Pick a question to auto-fill the chat input after opening the widget.
        </div>
    </div>
</div>

<script>
function fillChatFromDropdown() {
    const select = document.getElementById("sampleQuestion");
    const question = select.value;

    if (!question) {
        alert("Please select a sample question.");
        return;
    }

    const input = document.getElementById("chatInput");

    if (!input) {
        alert("Open the chat first.");
        return;
    }

    input.value = question;
    input.focus();
}
</script>

<script
    src="/widget.js"
    data-restaurant-id="harbor-steakhouse"
    data-title="Harbor Steakhouse"
    data-color="#7a1f1f"
    data-welcome="Welcome to Harbor Steakhouse! How can I help today?">
</script>

</body>
</html>
