<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Restaurant AI Widget Test</title>

<style>
body {
    font-family: Arial, sans-serif;
    margin: 40px;
}

.samples {
    margin-top: 20px;
}

.sample-btn {
    display: inline-block;
    margin: 6px;
    padding: 8px 12px;
    border-radius: 8px;
    border: 1px solid #ccc;
    background: #f5f5f5;
    cursor: pointer;
}

.sample-btn:hover {
    background: #e9e9e9;
}
</style>

</head>

<body>

<h1>Restaurant AI Widget Test Page</h1>

<p>This page simulates a restaurant website.</p>

<h3>Try asking:</h3>

<div class="samples">

<div class="sample-btn" onclick="fillChat('What steaks do you have?')">
What steaks do you have?
</div>

<div class="sample-btn" onclick="fillChat('Do you have anything under $40?')">
Do you have anything under $40?
</div>

<div class="sample-btn" onclick="fillChat('What are your most popular dishes?')">
What are your most popular dishes?
</div>

<div class="sample-btn" onclick="fillChat('Do you have seafood options?')">
Do you have seafood options?
</div>

<div class="sample-btn" onclick="fillChat('What appetizers do you recommend?')">
What appetizers do you recommend?
</div>

<div class="sample-btn" onclick="fillChat('What are your hours?')">
What are your hours?
</div>

</div>

<script>
function fillChat(question) {

    const input = document.getElementById("chatInput");

    if (!input) {
        alert("Open the chat first.");
        return;
    }

    input.value = question;
    input.focus();
}
</script>

<script
    src="/widget.js"
    data-restaurant-id="harbor-steakhouse"
    data-title="Harbor Steakhouse"
    data-color="#7a1f1f"
    data-welcome="Welcome to Harbor Steakhouse! How can I help today?">
</script>

</body>
</html>
